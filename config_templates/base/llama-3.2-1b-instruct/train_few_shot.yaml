seed: ${SEED}

# few-shot variant of train.yaml (100 training samples per dataset):
# - no val_size/eval + load_best: with only 100 samples a 10% val split is 10
#   noisy examples, so we train on all 100 and keep the final checkpoint.
# - more epochs (full fine-tuning at 1 epoch / 2e-6 barely moves on 100 samples).
# LR / batch size / scheduler are kept identical to the full-data template for
# comparability.

### model
model_name_or_path: meta-llama/Llama-3.2-1B-Instruct
trust_remote_code: true
flash_attn: auto
use_cache: false

### method
stage: sft
do_train: true
finetuning_type: full

### dataset
dataset: ${DATASET}
template: llama3
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 4
packing: false

### output
output_dir: ${OUTPUT_DIR}
logging_steps: 5
save_strategy: epoch
overwrite_output_dir: true
save_only_model: false
plot_loss: true
include_num_input_tokens_seen: true
push_to_hub: false
save_total_limit: 1

### train
per_device_train_batch_size: 8
learning_rate: 2.0e-6
num_train_epochs: 10
weight_decay: 1.0e-2
lr_scheduler_type: cosine
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
warmup_ratio: 0.1
optim: adamw_torch
report_to:
- wandb
run_name: ${WANDB_NAME}
